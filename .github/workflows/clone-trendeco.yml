name: Clone TrendEco baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clone-trendeco.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Widia repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone current TrendEco source
        run: |
          git clone --depth 1 https://github.com/polmechtech/trendeco-landing.git /tmp/trendeco
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/trendeco/ ./

      - name: Commit cloned baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Clone TrendEco baseline for Widia.tech [skip ci]'
          git push origin HEAD:main
