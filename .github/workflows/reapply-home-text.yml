name: Reapply Widia homepage text

on:
  push:
    paths:
      - '.github/workflows/reapply-home-text.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reapply homepage phrase
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = 'Sprzęt i narzędzia dostępne w sprzedaży na Allegro oraz bezpośrednio przez Widia.tech.'
          # Force a real source-file change while preserving the requested visible phrase.
          if old not in s:
              raise SystemExit('Requested phrase not found')
          s = s.replace(old, 'Sprzęt i narzędzia dostępne w sprzedaży na Allegro oraz bezpośrednio przez Widia.tech. ', 1)
          p.write_text(s)
          PY
          git config user.name 'polmechtech'
          git config user.email 'ndakarton@gmail.com'
          git add app/page.tsx
          git commit -m 'Reapply Widia homepage phrase'
          git push origin main
