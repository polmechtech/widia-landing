name: Remove homepage category buttons

on:
  push:
    paths:
      - '.github/workflows/remove-home-category-buttons.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove category buttons from homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/page.tsx')
          s = p.read_text()
          # Remove the homepage category-button block linking to /kategoria/*.
          patterns = [
              r'\s*<div[^>]*>\s*\{seoCategories\.map\(.*?\)\}\s*</div>',
              r'\s*\{seoCategories\.map\(.*?\)\}',
          ]
          original = s
          for pat in patterns:
              s2, n = re.subn(pat, '', s, count=1, flags=re.S)
              if n:
                  s = s2
                  break
          if s == original:
              raise SystemExit('Category button block not found; no changes made')
          p.write_text(s)
          PY
          git config user.name 'polmechtech'
          git config user.email 'ndakarton@gmail.com'
          git add app/page.tsx
          git commit -m 'Remove homepage category buttons'
          git push origin main
