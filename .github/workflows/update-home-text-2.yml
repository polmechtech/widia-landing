name: Update Widia homepage wording
on:
  push:
    paths:
      - '.github/workflows/update-home-text-2.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace homepage text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()
          s=s.replace('Maszyny i narzędzia dostępne w sprzedaży na Allegro oraz bezpośrednio przez Widia.tech.', 'Sprzęt i narzędzia dostępne w sprzedaży na Allegro oraz bezpośrednio przez Widia.tech.')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git diff --cached --quiet || git commit -m 'Update Widia homepage wording'
          git push
