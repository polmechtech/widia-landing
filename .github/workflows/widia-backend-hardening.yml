name: Widia.tech backend hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/widia-backend-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Separate Widia order namespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/api/order/route.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('return `TE-${date}-${crypto.randomUUID().slice(0,6).toUpperCase()}`;', 'return `WD-${date}-${crypto.randomUUID().slice(0,6).toUpperCase()}`;')
          s = s.replace('redis.lpush("orders:trendeco",number)', 'redis.lpush("orders:widia",number)')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit backend separation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/order/route.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Separate Widia order storage from TrendEco [skip ci]'
          git push origin HEAD:main
